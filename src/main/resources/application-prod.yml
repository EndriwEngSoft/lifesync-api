spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

lifesync:
  ai:
    # Falha fechada: em producao o modulo nasce desligado e sem provider.
    # Para ligar: LIFESYNC_AI_ENABLED=true, LIFESYNC_AI_PROVIDER=gemini e
    # LLM_API_KEY. O provider "fake" nao deve ser usado em producao.
    enabled: ${LIFESYNC_AI_ENABLED:false}
    provider: ${LIFESYNC_AI_PROVIDER:}
    # Mesmo ligado, so os ids desta lista usam a IA; vazia = ninguem (503).
    allowed-users: "${LIFESYNC_AI_ALLOWED_USERS:}"
    api-key: ${LLM_API_KEY:}
