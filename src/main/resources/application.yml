spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lifesync_db
    username: postgres
    # Fallback "123456" e so pra rodar local sem precisar setar variavel de
    # ambiente na maquina de dev - nunca deve virar senha real. Em staging/
    # producao, DB_PASSWORD tem que vir de secret manager/variavel de
    # ambiente do servidor, nunca deste arquivo - mesma logica do jwt.secret
    # logo abaixo.
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  # Plataformas de deploy costumam injetar PORT dinamico.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # So health, info e metrics ficam visiveis - env/beans/mappings
        # continuam fora, porque vazam detalhe interno da aplicacao.
        # Lembrar: exposure so controla o que existe na lista de endpoints
        # do actuator; quem controla se precisa de token pra acessar cada
        # um e o SecurityConfig (so /actuator/health esta em permitAll).
        include: health, info, metrics
  info:
    env:
      enabled: true

info:
  app:
    name: LifeSync API
    description: API REST de organizacao e produtividade pessoal
    version: 1.0.0

jwt:
  # JWT_SECRET precisa ter no minimo 32 caracteres (256 bits) — exigencia do
  # algoritmo HS256 usado pelo jjwt. Chave curta demais lanca WeakKeyException
  # em runtime. NUNCA versionar o valor real de producao, so este fallback de dev.
  secret: ${JWT_SECRET:lifesync-secret-key-to-development-2026}
  # Access token: vida curta (24h) — se vazar, o estrago e limitado.
  expiration: ${JWT_EXPIRATION:86400000}
  # Refresh token: vida mais longa (7 dias) — so serve para pedir um novo
  # access token, sem exigir login de novo toda hora.
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  cors:
    # CSV de origens permitidas (ex.: http://localhost:3000,http://localhost:5173).
    # Em producao, sobrescrever via APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
lifesync:
  ai:
    # Dev e testes usam o cliente fake (nenhuma chamada de rede, sem chave).
    # Em producao o application-prod.yml desliga o modulo por padrao e deixa
    # o provider vazio: ligar exige escolher o provider de forma explicita.
    enabled: ${LIFESYNC_AI_ENABLED:true}
    provider: ${LIFESYNC_AI_PROVIDER:fake}
    # Chave do provedor so por variavel de ambiente. Vazia por padrao; o
    # AiProperties derruba a subida se o provider for gemini e ela faltar.
    api-key: ${LLM_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: ${LIFESYNC_AI_MODEL:gemini-3.5-flash-lite}
    connect-timeout: 5s
    read-timeout: 30s
    max-tokens: 4096
    daily-quota: 5
    max-attempts: 3
    retry-backoff: 500ms
