# LifeSync API — Render Infrastructure as Code
# https://render.com/docs/blueprints
services:
  - type: web
    name: lifesync-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION
        value: "604800000"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Modulo de IA: nasce desligado e sem provider. Para ligar, mude
      # LIFESYNC_AI_ENABLED para "true" e LIFESYNC_AI_PROVIDER para "gemini".
      - key: LIFESYNC_AI_ENABLED
        value: "false"
      - key: LIFESYNC_AI_PROVIDER
        value: ""
      # Lista de permitidos: ids (UUID) das contas que podem usar a IA, separados
      # por virgula. Sem valor no repositorio; vazia = ninguem usa, mesmo ligado.
      - key: LIFESYNC_AI_ALLOWED_USERS
        sync: false
      # Chave do provedor: nunca no repositorio; preenchida no painel do Render.
      - key: LLM_API_KEY
        sync: false
